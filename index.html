html[data-ui="forest"] .card,html[data-ui="forest"] .kp div{background:linear-gradient(160deg,var(--tn1,rgba(70,150,100,.30)),var(--tn2,rgba(40,90,60,.10))),rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.10);border-radius:22px!important;box-shadow:0 18px 40px -24px rgba(0,0,0,.7);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
html[data-ui="forest"] .card>b{font:600 14px 'Inter',sans-serif;color:#e8f1ea}
html[data-ui="forest"] .kp{margin-bottom:12px}html[data-ui="forest"] .kp b{font:600 18px/1.3 'Inter',sans-serif;color:#e8f1ea}html[data-ui="forest"] .kp span{font-size:12px;color:#9db5a5}
html[data-ui="forest"] .hero{background:linear-gradient(160deg,var(--tn1,rgba(70,150,100,.30)),var(--tn2,rgba(40,90,60,.10))),rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.14);border-radius:28px!important;box-shadow:0 20px 40px -22px rgba(0,0,0,.7);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);padding:22px;text-align:left;margin:10px 0 14px}
html[data-ui="forest"] .hero b{font:700 36px 'Inter',sans-serif;color:#fff;text-shadow:none;letter-spacing:-1.5px}html[data-ui="forest"] .hero b.neg{color:#f0c070;text-shadow:none}
html[data-ui="forest"] .hero span{font:500 13px 'Inter',sans-serif;color:#b9d4c2}
html[data-ui="forest"] .hero.sp{padding:16px 22px;margin-top:0}html[data-ui="forest"] .hero.sp b{font-size:26px}
html[data-ui="forest"] .tabs{background:linear-gradient(160deg,var(--tn1,rgba(70,150,100,.30)),var(--tn2,rgba(40,90,60,.10))),rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.1);border-radius:999px!important;padding:6px;gap:4px;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
html[data-ui="forest"] .tabs button{font:600 12px 'Inter',sans-serif;border:0;background:transparent;color:#a9c4b3;padding:11px 2px;box-shadow:none;border-radius:999px!important}
html[data-ui="forest"] .tabs button.on{background:linear-gradient(135deg,#3f9a69,#6fcf97);color:#06180f;box-shadow:0 8px 16px -8px rgba(111,207,151,.6)}
html[data-ui="forest"] .tabs button:active,html[data-ui="forest"] .btn:active,html[data-ui="forest"] .x:active,html[data-ui="forest"] .sb:active{transform:scale(.96);box-shadow:none}
html[data-ui="forest"] .btn{background:linear-gradient(90deg,#2f8f5b,#78c995);color:#05150d;border:0;border-radius:999px!important;font:600 15px 'Inter',sans-serif;padding:15px;box-shadow:0 12px 24px -12px rgba(111,207,151,.5)}
html[data-ui="forest"] .x{background:rgba(224,162,74,.16);color:#f0c070;border:0;border-radius:999px!important;font:600 12px 'Inter',sans-serif;padding:7px 12px;box-shadow:none}
html[data-ui="forest"] .sb{font:600 12px 'Inter',sans-serif;background:rgba(255,255,255,.08);color:#d6e8dc;border:1px solid rgba(255,255,255,.14);border-radius:999px!important;box-shadow:none;padding:9px 14px}
html[data-ui="forest"] .sb.on{background:linear-gradient(135deg,#3f9a69,#6fcf97);color:#06180f;border-color:transparent}
html[data-ui="forest"] #gear{width:42px;height:42px;border-radius:50%!important;background:rgba(255,255,255,.1);color:#e8f1ea;border:1px solid rgba(255,255,255,.16);box-shadow:none;font-size:20px}
html[data-ui="forest"] input[type=text],html[data-ui="forest"] input[type=number],html[data-ui="forest"] input[type=date],html[data-ui="forest"] select{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);box-shadow:none;border-radius:14px!important;color:#e8f1ea;font:500 16px 'Inter',sans-serif}
html[data-ui="forest"] input.ai{width:96px;font:600 15px 'Inter',sans-serif;padding:4px 8px}
html[data-ui="forest"] .row{border-bottom:1px solid rgba(255,255,255,.08)}html[data-ui="forest"] .a{font-weight:600}
html[data-ui="forest"] .row input[type=checkbox]{width:24px;height:24px;border:2px solid #5f8a74;border-radius:50%!important;background:transparent;box-shadow:none}
html[data-ui="forest"] .row input[type=checkbox]:checked{background:#6fcf97;border-color:#6fcf97;box-shadow:inset 0 0 0 4px #0f2a1f}
html[data-ui="forest"] .tag{font:500 11px 'Inter',sans-serif;background:rgba(255,255,255,.08);border:0;color:#bfe8cc;border-radius:999px!important;padding:2px 8px}
html[data-ui="forest"] .mh{font:600 13px 'Inter',sans-serif;color:#8fe0b0;margin:16px 2px 6px}
html[data-ui="forest"] .pb{height:8px;background:rgba(255,255,255,.1);border:0;border-radius:99px!important;overflow:hidden}html[data-ui="forest"] .pb i{background:linear-gradient(90deg,#3f9a69,#c3e48a)}
html[data-ui="forest"] .bar .tr{height:10px;border-radius:99px!important;overflow:hidden;background:rgba(255,255,255,.1)}html[data-ui="forest"] .bar .e{background:#e0a24a}
.fs{display:none}
html[data-ui="forest"] .fs{display:block;position:relative;overflow:hidden;height:190px;background:var(--ph) center 28%/cover;border-radius:26px!important;margin:4px 0 12px;border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 40px -22px rgba(0,0,0,.7)}
html[data-ui="forest"] .fs::before{content:"";position:absolute;inset:0;background:var(--tb,#3f8f5f);mix-blend-mode:color;opacity:.62}
html[data-ui="forest"] .fs::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,22,15,.05),rgba(6,22,15,.5))}
.fs svg{position:relative;z-index:2}
.fs svg{display:block}.fs stop{transition:stop-color 1.4s ease}.fs .cn{transition:opacity 1.2s}
.fs .tw{transform-box:fill-box;transform-origin:50% 100%}.fs.gw .tw{animation:gw 1.1s ease-out}
@keyframes gw{40%{transform:scale(1.07)}}
.lf{animation:lf var(--d,3s) ease-in forwards;animation-delay:var(--dl,0s)}
@keyframes lf{0%{transform:translate(var(--x),var(--y0)) rotate(0);opacity:1}85%{opacity:1}100%{transform:translate(calc(var(--x) + var(--dx)),176px) rotate(var(--r));opacity:0}}
.mt{animation:mt var(--d,1.8s) ease-out forwards}
@keyframes mt{0%{transform:translate(var(--x),150px);opacity:0}20%{opacity:.9}100%{transform:translate(var(--x),30px);opacity:0}}
